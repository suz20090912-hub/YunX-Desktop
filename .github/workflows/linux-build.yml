name: Linux 构建

on:
  push:
    branches: [main, linux-port]
  pull_request:
    branches: [main, linux-port]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Debian 打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: 编译 Kotlin
        run: |
          chmod +x gradlew
          ./gradlew :desktop:compileKotlin --console=plain

      - name: 打 Debian 包
        run: |
          chmod +x gradlew
          ./gradlew :desktop:packageDeb --console=plain

      - name: 上传 deb 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: yunx-desktop-linux-deb
          path: desktop/build/compose/binaries/main/deb/*.deb
          if-no-files-found: error
