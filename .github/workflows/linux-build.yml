name: YunX-Desktop Linux 构建与验证

on:
  push:
    branches: [linux-port, main]
  workflow_dispatch:
    inputs:
      build_mac:
        description: "同时尝试 macOS 构建（不签名，只验证能否编译打包）"
        type: boolean
        default: false

jobs:
  linux-deb:
    name: Linux deb
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 还原 linux-port 补丁
        run: |
          set -e
          mkdir -p ci
          cat > /tmp/p.b64 <<'B64EOF'
          
          B64EOF
          base64 -d /tmp/p.b64 > ci/linux-port.patch
          wc -l ci/linux-port.patch
          if ! git apply --check ci/linux-port.patch; then
            echo "::error::补丁无法应用 —— 上游代码已变动，需要重新生成"
            exit 1
          fi
          git apply ci/linux-port.patch
          git --no-pager diff --stat

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            fakeroot dpkg-dev rpm binutils \
            libgtk-3-0 libnss3 libgbm1 libxkbcommon0 libxkbcommon-x11-0 \
            libasound2 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libpango-1.0-0 \
            libgl1 libglx-mesa0 fonts-noto-cjk \
            xvfb x11-utils xdotool imagemagick openbox

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 编译并打 deb
        run: |
          java -Xmx64m -jar gradle/wrapper/gradle-wrapper.jar :desktop:packageDeb \
            --console=plain --no-daemon \
            "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m" 2>&1 | tee /tmp/gradle.log

      - name: 校验 deb 内容
        run: |
          set -euo pipefail
          shopt -s nullglob
          DEBS=(desktop/build/compose/binaries/main/deb/*.deb)
          DEB="${DEBS[0]}"
          SIZE=$(stat -c%s "$DEB")
          echo "产物: $DEB"
          echo "体积: $((SIZE/1024/1024)) MB"
          if [ "$SIZE" -lt 104857600 ]; then
            echo "::error::包体异常（$((SIZE/1024/1024)) MB），JCEF 原生库可能缺失"
            exit 1
          fi
          dpkg-deb -c "$DEB" > /tmp/deb-list.txt
          if ! grep -Eq 'bin/(YunX-Desktop|yunx-desktop)' /tmp/deb-list.txt; then
            echo "::error::包内缺少 bin/YunX-Desktop 启动脚本"
            exit 1
          fi
          echo "包体与内容检查通过"
          mkdir -p out && cp "$DEB" out/

      - name: 安装 deb
        run: |
          set -uo pipefail
          sudo mkdir -p /usr/share/applications /usr/local/share/applications
          sudo dpkg -i out/*.deb || echo "dpkg -i 返回非零（postinst 的 xdg 菜单目录问题），继续尝试配置"
          sudo dpkg --configure -a || true
          STATUS=$(dpkg-query -W -f='${Status}' yunx-desktop 2>/dev/null || echo "missing")
          echo "dpkg 状态: $STATUS"
          if [ "$STATUS" != "install ok installed" ]; then
            echo "::error::安装状态不是 install ok installed"
            exit 1
          fi
          dpkg-query -L yunx-desktop | grep -E 'bin/|\.desktop$' || true

      - name: 虚拟显示器下启动并断言
        run: |
          set -uo pipefail
          export YUNX_DESKTOP_DATA_DIR="$HOME/.yunx-test"
          setsid Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > /tmp/xvfb.log 2>&1 < /dev/null &
          sleep 3
          export DISPLAY=:99
          setsid openbox > /tmp/openbox.log 2>&1 < /dev/null &
          sleep 2
          APP=$(dpkg-query -L yunx-desktop 2>/dev/null | grep -E '^/opt/.*/bin/' | while read -r p; do [ -f "$p" ] && [ -x "$p" ] && echo "$p"; done | head -n1)
          [ -n "$APP" ] || APP=/opt/yunx-desktop/bin/YunX-Desktop
          echo "启动器: $APP"
          setsid "$APP" > /tmp/yunx.log 2>&1 < /dev/null &
          APP_PID=$!
          echo "应用 PID: $APP_PID"

          FAIL=0
          for i in $(seq 1 20); do
            sleep 3
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "::error::进程在第 $((i*3)) 秒退出"
              FAIL=1
              break
            fi
          done

          echo "--- 应用日志（前 120 行）---"
          head -n 120 /tmp/yunx.log || true

          if grep -q 'UnsatisfiedLinkError' /tmp/yunx.log; then
            echo "::error::日志里出现 UnsatisfiedLinkError"
            FAIL=1
          fi
          if grep -qiE 'ClassNotFound|NoClassDefFound' /tmp/yunx.log; then
            echo "::error::日志里出现类找不到（jlink 裁模块裁漏了）"
            FAIL=1
          fi

          if [ -f "$YUNX_DESKTOP_DATA_DIR/yunx.db" ]; then
            echo "已生成 yunx.db（SQLite 链路正常）"
            ls -l "$YUNX_DESKTOP_DATA_DIR/yunx.db"
          else
            echo "::warning::没看到 yunx.db，不判失败"
          fi

          WIN=$(xdotool search --onlyvisible --name "YunX" 2>/dev/null | head -n1 || true)
          if [ -n "$WIN" ]; then
            echo "找到窗口 id=$WIN"
            xdotool windowraise "$WIN" || true
            sleep 1
          else
            echo "::warning::xdotool 没搜到窗口名（软断言，不判失败）"
          fi
          import -window root /tmp/shot.png || true
          mkdir -p out
          [ -f /tmp/shot.png ] && cp /tmp/shot.png out/screenshot.png
          cp /tmp/yunx.log out/yunx.log || true

          kill "$APP_PID" 2>/dev/null || true
          pkill -f 'Main[K]t' 2>/dev/null || true

          if [ "$FAIL" -ne 0 ]; then exit 1; fi
          echo "启动验证通过"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yunx-desktop-linux-deb
          path: |
            out/
            /tmp/gradle.log
          if-no-files-found: warn
          retention-days: 14

  mac-build:
    name: macOS 尝试构建
    if: github.event_name == 'workflow_dispatch' && inputs.build_mac
    runs-on: macos-13
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 还原补丁
        run: |
          set -e
          mkdir -p ci
          cat > /tmp/p.b64 <<'B64EOF'
          
          B64EOF
          base64 -D -i /tmp/p.b64 -o ci/linux-port.patch
          git apply ci/linux-port.patch
          git --no-pager diff --stat

      - name: 打 dmg（不签名）
        run: |
          java -Xmx64m -jar gradle/wrapper/gradle-wrapper.jar :desktop:packageDmg \
            --console=plain --no-daemon \
            "-Dorg.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=512m" 2>&1 | tee /tmp/gradle-mac.log

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yunx-desktop-macos-dmg-unsigned
          path: |
            desktop/build/compose/binaries/main/dmg/
            /tmp/gradle-mac.log
          if-no-files-found: warn
          retention-days: 14
