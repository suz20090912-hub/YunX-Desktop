name: Linux Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Debian 打包依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: 打 Debian 包
        run: |
          chmod +x gradlew
          ./gradlew :desktop:packageDeb --console=plain

      - name: 创建 Release 并上传 deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" desktop/build/compose/binaries/main/deb/*.deb --clobber
